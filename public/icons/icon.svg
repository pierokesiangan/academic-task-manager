<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B131D" />
      <stop offset="50%" stop-color="#131E2D" />
      <stop offset="100%" stop-color="#1C2C40" />
    </linearGradient>
    <linearGradient id="star" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF0" />
      <stop offset="50%" stop-color="#FFF7CC" />
      <stop offset="100%" stop-color="#FEF08A" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded box -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="#7DA7D9" stroke-width="6" stroke-opacity="0.4" />

  <!-- Soft Cobalt Ambient Ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#7DA7D9" stroke-width="2" stroke-dasharray="12 12" stroke-opacity="0.3" />

  <!-- 4-Point Butter Yellow Star (Icon from Ice & Butter Palette) -->
  <g filter="url(#glow)">
    <path d="M 256,96 C 256,192 256,192 160,256 C 256,256 256,256 256,416 C 256,256 256,256 352,256 C 256,192 256,192 256,96 Z" fill="url(#star)" />
  </g>

  <!-- Ice Blue Small Accent Stars -->
  <path d="M 160,140 C 160,165 160,165 135,175 C 160,175 160,175 160,210 C 160,175 160,175 185,175 C 160,165 160,165 160,140 Z" fill="#DCEEFF" opacity="0.8" />
  <path d="M 360,330 C 360,350 360,350 340,360 C 360,360 360,360 360,380 C 360,360 360,360 380,360 C 360,350 360,350 360,330 Z" fill="#DCEEFF" opacity="0.8" />
</svg>
